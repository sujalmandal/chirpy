[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["app"]
